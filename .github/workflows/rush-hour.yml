name: 🚦 Rush Hour Notifications

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger button

jobs:
  check-rush-hour:
    runs-on: ubuntu-latest

    steps:
      - name: Check Rush Hour Status (with real epoch timestamps)
        id: rush_check
        run: |
          export TZ='Asia/Manila'

          NOW_EPOCH=$(date +%s)
          # 10# forces base-10 parsing so "08" / "09" don't crash as invalid octal
          PH_HOUR=$(date +"%H")
          PH_MIN=$(date +"%M")
          PH_TIME=$((10#$PH_HOUR * 100 + 10#$PH_MIN))
          TODAY=$(date +"%Y-%m-%d")

          echo "🕐 Philippines Time: $PH_HOUR:$PH_MIN"

          MORNING_START_EPOCH=$(date -d "$TODAY 04:00:00" +%s)
          MORNING_END_EPOCH=$(date -d "$TODAY 08:00:00" +%s)
          EVENING_START_EPOCH=$(date -d "$TODAY 17:00:00" +%s)
          EVENING_END_EPOCH=$(date -d "$TODAY 22:00:00" +%s)
          NEXT_MORNING_START_EPOCH=$(date -d "$TODAY +1 day 04:00:00" +%s)

          echo "ph_time=$PH_TIME" >> $GITHUB_OUTPUT

          JUST_ENDED="none"
          IS_START="false"

          if [ "$NOW_EPOCH" -ge "$MORNING_START_EPOCH" ] && [ "$NOW_EPOCH" -lt "$MORNING_END_EPOCH" ]; then
            STATUS="morning"
            END_EPOCH=$MORNING_END_EPOCH
            NEXT_LABEL="Evening Rush"
            NEXT_EPOCH=$EVENING_START_EPOCH
            if [ $((NOW_EPOCH - MORNING_START_EPOCH)) -lt 300 ]; then IS_START="true"; fi
            echo "🌅 Morning Rush is active!"

          elif [ "$NOW_EPOCH" -ge "$EVENING_START_EPOCH" ] && [ "$NOW_EPOCH" -lt "$EVENING_END_EPOCH" ]; then
            STATUS="evening"
            END_EPOCH=$EVENING_END_EPOCH
            NEXT_LABEL="Morning Rush"
            NEXT_EPOCH=$NEXT_MORNING_START_EPOCH
            if [ $((NOW_EPOCH - EVENING_START_EPOCH)) -lt 300 ]; then IS_START="true"; fi
            echo "🌆 Evening Rush is active!"

          else
            STATUS="none"
            END_EPOCH=0
            echo "⏰ No rush hour currently."

            DIFF_MORNING_END=$((NOW_EPOCH - MORNING_END_EPOCH))
            DIFF_EVENING_END=$((NOW_EPOCH - EVENING_END_EPOCH))

            if [ "$DIFF_MORNING_END" -ge 0 ] && [ "$DIFF_MORNING_END" -lt 300 ]; then
              JUST_ENDED="morning"
            elif [ "$DIFF_EVENING_END" -ge 0 ] && [ "$DIFF_EVENING_END" -lt 300 ]; then
              JUST_ENDED="evening"
            fi

            if [ "$NOW_EPOCH" -lt "$MORNING_START_EPOCH" ]; then
              NEXT_LABEL="Morning Rush"; NEXT_EPOCH=$MORNING_START_EPOCH
            elif [ "$NOW_EPOCH" -lt "$EVENING_START_EPOCH" ]; then
              NEXT_LABEL="Evening Rush"; NEXT_EPOCH=$EVENING_START_EPOCH
            else
              NEXT_LABEL="Morning Rush"; NEXT_EPOCH=$NEXT_MORNING_START_EPOCH
            fi
          fi

          echo "rush_status=$STATUS" >> $GITHUB_OUTPUT
          echo "end_epoch=$END_EPOCH" >> $GITHUB_OUTPUT
          echo "next_rush=$NEXT_LABEL" >> $GITHUB_OUTPUT
          echo "next_epoch=$NEXT_EPOCH" >> $GITHUB_OUTPUT
          echo "is_start=$IS_START" >> $GITHUB_OUTPUT
          echo "just_ended=$JUST_ENDED" >> $GITHUB_OUTPUT

      - name: Send Morning Rush Start Notification
        if: steps.rush_check.outputs.rush_status == 'morning' && steps.rush_check.outputs.is_start == 'true'
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "🌅 RUSH HOUR STARTED!",
              "description": "**Morning Rush** is now active!\n\n🕐 **4:00 AM - 8:00 AM** (Philippines Time)\n⏳ **Ends: <t:'"${{ steps.rush_check.outputs.end_epoch }}"':R>**\n🚶 **More passengers available!**\n\n💡 This is the best time to drive for maximum earnings!",
              "color": 16497956,
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
              "footer": {
                "text": "🚐 Fare Matrix • Diesel N Steel",
                "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
              },
              "fields": [
                {"name": "⏰ Time", "value": "4:00 AM - 8:00 AM", "inline": true},
                {"name": "⏳ Ends", "value": "<t:'"${{ steps.rush_check.outputs.end_epoch }}"':R>", "inline": true},
                {"name": "🚶 Passengers", "value": "⬆️ High Volume", "inline": true},
                {"name": "💰 Earnings", "value": "🔥 Maximum", "inline": true},
                {"name": "🕐 Next Rush", "value": "'"${{ steps.rush_check.outputs.next_rush }}"' • <t:'"${{ steps.rush_check.outputs.next_epoch }}"':R>", "inline": false}
              ]
            }]
          }' $WEBHOOK_URL
          echo "✅ Morning Rush notification sent!"

      - name: Send Evening Rush Start Notification
        if: steps.rush_check.outputs.rush_status == 'evening' && steps.rush_check.outputs.is_start == 'true'
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "🌆 RUSH HOUR STARTED!",
              "description": "**Evening Rush** is now active!\n\n🕐 **5:00 PM - 10:00 PM** (Philippines Time)\n⏳ **Ends: <t:'"${{ steps.rush_check.outputs.end_epoch }}"':R>**\n🚶 **More passengers available!**\n\n💡 This is the best time to drive for maximum earnings!",
              "color": 16334072,
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
              "footer": {
                "text": "🚐 Fare Matrix • Diesel N Steel",
                "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
              },
              "fields": [
                {"name": "⏰ Time", "value": "5:00 PM - 10:00 PM", "inline": true},
                {"name": "⏳ Ends", "value": "<t:'"${{ steps.rush_check.outputs.end_epoch }}"':R>", "inline": true},
                {"name": "🚶 Passengers", "value": "⬆️ High Volume", "inline": true},
                {"name": "💰 Earnings", "value": "🔥 Maximum", "inline": true},
                {"name": "🕐 Next Rush", "value": "'"${{ steps.rush_check.outputs.next_rush }}"' • <t:'"${{ steps.rush_check.outputs.next_epoch }}"':R>", "inline": false}
              ]
            }]
          }' $WEBHOOK_URL
          echo "✅ Evening Rush notification sent!"

      - name: Send Rush Hour Ended Notification (Morning)
        if: steps.rush_check.outputs.just_ended == 'morning'
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "⏰ RUSH HOUR ENDED",
              "description": "🌅 **Morning Rush** has ended.\n\n📊 **Normal passenger volume** now.\n\n🕐 Next Rush Hour: **'"${{ steps.rush_check.outputs.next_rush }}"'**\n⏳ **Starts: <t:'"${{ steps.rush_check.outputs.next_epoch }}"':R>**",
              "color": 7039855,
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
              "footer": {
                "text": "🚐 Fare Matrix • Diesel N Steel",
                "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
              }
            }]
          }' $WEBHOOK_URL
          echo "✅ Morning Rush Ended notification sent!"

      - name: Send Rush Hour Ended Notification (Evening)
        if: steps.rush_check.outputs.just_ended == 'evening'
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "⏰ RUSH HOUR ENDED",
              "description": "🌆 **Evening Rush** has ended.\n\n📊 **Normal passenger volume** now.\n\n🕐 Next Rush Hour: **'"${{ steps.rush_check.outputs.next_rush }}"'**\n⏳ **Starts: <t:'"${{ steps.rush_check.outputs.next_epoch }}"':R>**",
              "color": 7039855,
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
              "footer": {
                "text": "🚐 Fare Matrix • Diesel N Steel",
                "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
              }
            }]
          }' $WEBHOOK_URL
          echo "✅ Evening Rush Ended notification sent!"

      - name: Send No Rush Hour Status (twice hourly heartbeat)
        if: steps.rush_check.outputs.rush_status == 'none' && steps.rush_check.outputs.just_ended == 'none'
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          export TZ='Asia/Manila'
          PH_MIN=$(date +"%M")

          if [ "$PH_MIN" == "00" ] || [ "$PH_MIN" == "30" ]; then
            curl -X POST -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "⏰ NORMAL HOURS",
                "description": "📊 **No Rush Hour** currently.\n\n🕐 Next Rush Hour: **'"${{ steps.rush_check.outputs.next_rush }}"'**\n⏳ **Starts: <t:'"${{ steps.rush_check.outputs.next_epoch }}"':R>**\n🚶 Normal passenger volume.",
                "color": 7039855,
                "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
                "footer": {
                  "text": "🚐 Fare Matrix • Diesel N Steel",
                  "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
                }
              }]
            }' $WEBHOOK_URL
            echo "✅ Status update sent!"
          fi
