name: 🚦 Rush Hour Notifications

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  check-rush-hour:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Rush Hour Status
        id: rush_check
        run: |
          # Get current time in Philippines (UTC+8)
          PH_HOUR=$(TZ='Asia/Manila' date +"%H")
          PH_MINUTE=$(TZ='Asia/Manila' date +"%M")
          PH_TIME=$((PH_HOUR * 100 + PH_MINUTE))
          
          echo "🕐 Philippines Time: $PH_HOUR:$PH_MINUTE"
          
          # Rush Hour times
          START_MORNING=400
          END_MORNING=800
          START_EVENING=1700
          END_EVENING=2200
          
          # Calculate countdown
          CURRENT_MINUTES=$((PH_HOUR * 60 + PH_MINUTE))
          MORNING_START_MIN=$((4 * 60))
          MORNING_END_MIN=$((8 * 60))
          EVENING_START_MIN=$((17 * 60))
          EVENING_END_MIN=$((22 * 60))
          
          # Determine rush status
          if [ $PH_TIME -ge $START_MORNING ] && [ $PH_TIME -lt $END_MORNING ]; then
            echo "rush_status=morning" >> $GITHUB_OUTPUT
            echo "🌅 Morning Rush is active!"
            
            REMAINING_MIN=$((MORNING_END_MIN - CURRENT_MINUTES))
            REMAINING_HOURS=$((REMAINING_MIN / 60))
            REMAINING_MINS=$((REMAINING_MIN % 60))
            echo "remaining_time=${REMAINING_HOURS}h ${REMAINING_MINS}m" >> $GITHUB_OUTPUT
            echo "next_rush=Evening Rush" >> $GITHUB_OUTPUT
            
          elif [ $PH_TIME -ge $START_EVENING ] && [ $PH_TIME -lt $END_EVENING ]; then
            echo "rush_status=evening" >> $GITHUB_OUTPUT
            echo "🌆 Evening Rush is active!"
            
            REMAINING_MIN=$((EVENING_END_MIN - CURRENT_MINUTES))
            REMAINING_HOURS=$((REMAINING_MIN / 60))
            REMAINING_MINS=$((REMAINING_MIN % 60))
            echo "remaining_time=${REMAINING_HOURS}h ${REMAINING_MINS}m" >> $GITHUB_OUTPUT
            echo "next_rush=Morning Rush" >> $GITHUB_OUTPUT
            
          else
            echo "rush_status=none" >> $GITHUB_OUTPUT
            echo "⏰ No rush hour currently."
            
            if [ $PH_TIME -lt $START_MORNING ]; then
              DIFF_MIN=$((MORNING_START_MIN - CURRENT_MINUTES))
              echo "next_rush=Morning Rush" >> $GITHUB_OUTPUT
            elif [ $PH_TIME -lt $START_EVENING ]; then
              DIFF_MIN=$((EVENING_START_MIN - CURRENT_MINUTES))
              echo "next_rush=Evening Rush" >> $GITHUB_OUTPUT
            else
              DIFF_MIN=$((24 * 60 + MORNING_START_MIN - CURRENT_MINUTES))
              echo "next_rush=Morning Rush" >> $GITHUB_OUTPUT
            fi
            
            DIFF_HOURS=$((DIFF_MIN / 60))
            DIFF_MINS=$((DIFF_MIN % 60))
            echo "countdown_to_next=${DIFF_HOURS}h ${DIFF_MINS}m" >> $GITHUB_OUTPUT
          fi
          
      - name: Check and Send Notifications
        env:
          WEBHOOK_URL: "https://discord.com/api/webhooks/1532384477567910141/B-vRoVNAVqPXJVfPvkzfJvfsF_kTQ8DzSISnlzwiUKXDVZuiPrYpfzuZ7p5TT36ENHHG"
        run: |
          RUSH_STATUS="${{ steps.rush_check.outputs.rush_status }}"
          PH_TIME=${{ steps.rush_check.outputs.ph_time }}
          PH_HOUR=$(TZ='Asia/Manila' date +"%H")
          PH_MINUTE=$(TZ='Asia/Manila' date +"%M")
          
          # Read previous state from cache file
          STATE_FILE="rush_state.txt"
          PREV_STATUS="none"
          
          if [ -f "$STATE_FILE" ]; then
            PREV_STATUS=$(cat "$STATE_FILE")
          fi
          
          echo "📊 Previous Status: $PREV_STATUS"
          echo "📊 Current Status: $RUSH_STATUS"
          
          # Check if status CHANGED (this is the key fix!)
          if [ "$PREV_STATUS" == "none" ] && [ "$RUSH_STATUS" == "morning" ]; then
            echo "🌅 Morning Rush STARTED!"
            curl -X POST -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "🌅 RUSH HOUR STARTED!",
                "description": "**Morning Rush** is now active!\n\n🕐 **4:00 AM - 8:00 AM** (Philippines Time)\n⏳ **Ends in: '"${{ steps.rush_check.outputs.remaining_time }}"'**\n🚶 **More passengers available!**\n\n💡 This is the best time to drive for maximum earnings!",
                "color": 16497956,
                "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
                "footer": {
                  "text": "🚐 Fare Matrix • Diesel N Steel",
                  "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
                },
                "fields": [
                  {"name": "⏰ Time", "value": "4:00 AM - 8:00 AM", "inline": true},
                  {"name": "⏳ Ends In", "value": "'"${{ steps.rush_check.outputs.remaining_time }}"'", "inline": true},
                  {"name": "🚶 Passengers", "value": "⬆️ High Volume", "inline": true},
                  {"name": "💰 Earnings", "value": "🔥 Maximum", "inline": true},
                  {"name": "🕐 Next Rush", "value": "'"${{ steps.rush_check.outputs.next_rush }}"' at 5:00 PM", "inline": false}
                ]
              }]
            }' $WEBHOOK_URL
            echo "✅ Morning Rush START notification sent!"
            
          elif [ "$PREV_STATUS" == "morning" ] && [ "$RUSH_STATUS" == "none" ]; then
            echo "🌅 Morning Rush ENDED!"
            curl -X POST -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "⏰ RUSH HOUR ENDED",
                "description": "🌅 **Morning Rush** has ended.\n\n📊 **Normal passenger volume** now.\n\n🕐 Next Rush Hour: **Evening Rush** at **5:00 PM**\n⏳ **Starts in: 9h**",
                "color": 7039855,
                "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
                "footer": {
                  "text": "🚐 Fare Matrix • Diesel N Steel",
                  "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
                }
              }]
            }' $WEBHOOK_URL
            echo "✅ Morning Rush END notification sent!"
            
          elif [ "$PREV_STATUS" == "none" ] && [ "$RUSH_STATUS" == "evening" ]; then
            echo "🌆 Evening Rush STARTED!"
            curl -X POST -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "🌆 RUSH HOUR STARTED!",
                "description": "**Evening Rush** is now active!\n\n🕐 **5:00 PM - 10:00 PM** (Philippines Time)\n⏳ **Ends in: '"${{ steps.rush_check.outputs.remaining_time }}"'**\n🚶 **More passengers available!**\n\n💡 This is the best time to drive for maximum earnings!",
                "color": 16334072,
                "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
                "footer": {
                  "text": "🚐 Fare Matrix • Diesel N Steel",
                  "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
                },
                "fields": [
                  {"name": "⏰ Time", "value": "5:00 PM - 10:00 PM", "inline": true},
                  {"name": "⏳ Ends In", "value": "'"${{ steps.rush_check.outputs.remaining_time }}"'", "inline": true},
                  {"name": "🚶 Passengers", "value": "⬆️ High Volume", "inline": true},
                  {"name": "💰 Earnings", "value": "🔥 Maximum", "inline": true},
                  {"name": "🕐 Next Rush", "value": "'"${{ steps.rush_check.outputs.next_rush }}"' at 4:00 AM (tomorrow)", "inline": false}
                ]
              }]
            }' $WEBHOOK_URL
            echo "✅ Evening Rush START notification sent!"
            
          elif [ "$PREV_STATUS" == "evening" ] && [ "$RUSH_STATUS" == "none" ]; then
            echo "🌆 Evening Rush ENDED!"
            curl -X POST -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "⏰ RUSH HOUR ENDED",
                "description": "🌆 **Evening Rush** has ended.\n\n📊 **Normal passenger volume** now.\n\n🕐 Next Rush Hour: **Morning Rush** at **4:00 AM**\n⏳ **Starts in: 6h**",
                "color": 7039855,
                "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")'",
                "footer": {
                  "text": "🚐 Fare Matrix • Diesel N Steel",
                  "icon_url": "https://aizen807.github.io/dns-fare-guide1/icon-192.png"
                }
              }]
            }' $WEBHOOK_URL
            echo "✅ Evening Rush END notification sent!"
          fi
          
          # Save current status for next run
          echo "$RUSH_STATUS" > rush_state.txt
          
      - name: Upload State
        uses: actions/upload-artifact@v4
        with:
          name: rush-state
          path: rush_state.txt
          retention-days: 1
          
      - name: Download State for Next Run
        uses: actions/download-artifact@v4
        with:
          name: rush-state
          path: .
        continue-on-error: true
